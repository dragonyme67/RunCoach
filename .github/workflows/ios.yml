name: iOS
on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "AppUITests/**"
      - "Packages/**"
      - "project.yml"
      - "scripts/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    # Publication de l'IPA en release pour SideStore (dernière étape).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list devices available | head -40
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Pick a large iPhone simulator
        id: sim
        run: echo "udid=$(python3 scripts/pick_simulator.py)" >> "$GITHUB_OUTPUT"
      - name: Build app and capture screenshots
        run: |
          set -o pipefail
          xcodebuild test -quiet \
            -project RunCoach.xcodeproj -scheme RunCoach \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/dd-sim \
            -resultBundlePath build/ui.xcresult \
            -retry-tests-on-failure -test-iterations 3
      - name: Show test failures
        if: failure()
        run: xcrun xcresulttool get test-results summary --path build/ui.xcresult || true
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/ui.xcresult --output-path build/screenshots || true
          ls -la build/screenshots || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: warn
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          xcodebuild build -quiet \
            -project RunCoach.xcodeproj -scheme RunCoach \
            -configuration Release -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/dd-ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=0.1.${{ github.run_number }}
          mkdir -p build/ipa/Payload
          cp -R build/dd-ios/Build/Products/Release-iphoneos/RunCoach.app build/ipa/Payload/
          # IPA non signée : SideStore lit les droits (App Group des widgets) dans les binaires, posés ici par ldid.
          brew install ldid
          APP=build/ipa/Payload/RunCoach.app
          ldid -SWidgets/Resources/RunCoachWidgets.entitlements "$APP/PlugIns/RunCoachWidgets.appex/RunCoachWidgets"
          ldid -SApp/Resources/RunCoach.entitlements "$APP/RunCoach"
          (cd build/ipa && zip -qry ../RunCoach.ipa Payload)
          ls -la build/RunCoach.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/RunCoach.ipa
      # Source SideStore : https://github.com/<dépôt>/releases/latest/download/source.json (adresse fixe).
      # Chaque build vert de main devient une release ; SideStore y voit une mise à jour. On garde les 10 dernières.
      - name: Publish release for SideStore
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="build-${{ github.run_number }}"
          python3 scripts/sidestore_source.py build/dd-ios/Build/Products/Release-iphoneos/RunCoach.app/Info.plist \
            build/RunCoach.ipa "${{ github.repository }}" "$TAG" build/source.json
          gh release create "$TAG" build/RunCoach.ipa build/source.json \
            --title "RunCoach build ${{ github.run_number }}" --notes "Build ${{ github.sha }}" --latest
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^build-' | sort -t- -k2 -n -r | tail -n +11 \
            | while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
