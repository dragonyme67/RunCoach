name: RunCoach
options:
  bundleIdPrefix: local.runcoach
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  RunCoachCore:
    path: Packages/RunCoachCore
targets:
  RunCoach:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: RunCoachCore
    # Synchro Garmin en arrière-plan (BackgroundSync.swift). Fichier généré par xcodegen, fusionné avec les clés INFOPLIST_KEY_*.
    info:
      path: App/Resources/Info.plist
      properties:
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [local.runcoach.app.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.runcoach.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RunCoach
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  RunCoachUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppUITests
    dependencies:
      - target: RunCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.runcoach.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RunCoach
schemes:
  RunCoach:
    build:
      targets:
        RunCoach: all
        RunCoachUITests: [test]
    test:
      targets:
        - RunCoachUITests
